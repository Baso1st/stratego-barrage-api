name: Roll back production

# Run by hand from the live release's tag: the production environment only accepts v* tags.
# Swaps the staging slot, which holds the release before it, back into production. Running it again goes forward again.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# The release's group, so a rollback never runs at the same time as a release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Check the staging slot's health endpoint
        run: bash .github/scripts/wait-until-healthy.sh "https://app-stratego-api-prod-staging.azurewebsites.net/health"

      - name: Swap the staging slot into production
        run: >
          az webapp deployment slot swap
          --resource-group rg-stratego-api-prod
          --name app-stratego-api-prod
          --slot staging
          --target-slot production

      - name: Check production's health endpoint
        run: bash .github/scripts/wait-until-healthy.sh "https://app-stratego-api-prod.azurewebsites.net/health"
